name: Signed Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is generated by npm 11. Node 22 ships npm 10, whose
      # resolver builds a different ideal tree and rejects it outright, so pin
      # npm rather than let a local `npm install` keep re-breaking CI.
      - run: npm install -g npm@11

      - name: Verify exact stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$env:RELEASE_TAG"

      - name: Refuse unsigned releases
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'WIN_CSC_LINK is required; unsigned releases are forbidden.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'WIN_CSC_KEY_PASSWORD is required; unsigned releases are forbidden.'
          }

      - run: npm ci --no-audit --no-fund
      - run: npm run audit:security
      - run: npm run check
      - run: npm run build
      - name: Build signed Windows release
        run: npm run release:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_CHANNEL: latest

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem dist -File -Filter '*-setup.exe'
            Get-Item 'dist/win-unpacked/interview-copilot.exe'
          )
          if ($files.Count -lt 2) { throw 'Signed installer or packaged executable is missing.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($file.Name): $($signature.Status)"
            }
          }

      - name: Generate release metadata and checksums
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'build/generated/build-metadata.json' -Destination 'dist/build-metadata.json'
          if (-not (Test-Path 'dist/latest.yml')) { throw 'Missing latest.yml update manifest.' }
          npm run release:checksums

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows-release-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/build-metadata.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build-windows
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-windows-release-${{ github.sha }}
          path: dist

      - name: Verify transferred artifact checksums
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath 'dist/SHA256SUMS.txt')
          if ($lines.Count -lt 4) { throw 'Release checksum manifest is incomplete.' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Malformed checksum entry: $line" }
            $file = Join-Path 'dist' $Matches[2]
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Checksummed asset is missing: $file" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $Matches[1]) { throw "Checksum mismatch for $file" }
          }
          $installers = @(Get-ChildItem dist -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one signed installer, found $($installers.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Transferred installer signature is not valid: $($signature.Status)" }

      - name: Publish complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem dist -File | Where-Object {
              $_.Name -match '\.(exe|blockmap)$' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'build-metadata.json' -or
              $_.Name -eq 'SHA256SUMS.txt'
            }
          )
          if ($assets.Count -lt 4) { throw 'Release asset set is incomplete.' }
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "Interview Copilot $env:GITHUB_REF_NAME" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft GitHub release.' }
          gh release upload $env:GITHUB_REF_NAME @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload every release asset.' }
          $expected = @($assets | ForEach-Object Name | Sort-Object)
          $uploaded = @(gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name' | Sort-Object)
          if (@(Compare-Object $expected $uploaded).Count -ne 0) {
            throw 'Published release asset list did not match the verified build output.'
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified draft release.' }
