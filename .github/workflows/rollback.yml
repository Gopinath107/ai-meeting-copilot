name: Prepare Signed Windows Rollback

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Previously signed stable tag to offer on the rollback channel
        required: true
        type: string
      confirm:
        description: Type ROLLBACK to publish emergency rollback metadata
        required: true
        type: string

concurrency:
  group: windows-rollback
  cancel-in-progress: false

jobs:
  verify-rollback:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      current_tag: ${{ steps.validate.outputs.current_tag }}
    env:
      TARGET_TAG: ${{ inputs.target_tag }}
      CONFIRM_ROLLBACK: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate rollback request
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CONFIRM_ROLLBACK -cne 'ROLLBACK') { throw 'Rollback confirmation did not match ROLLBACK.' }
          if ($env:TARGET_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'target_tag must be a stable vMAJOR.MINOR.PATCH tag.' }
          $currentTag = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($currentTag)) { throw 'Could not resolve the current GitHub release.' }
          if ([version]$env:TARGET_TAG.Substring(1) -ge [version]$currentTag.Substring(1)) {
            throw "Rollback target $env:TARGET_TAG must be older than current release $currentTag."
          }
          $target = gh release view $env:TARGET_TAG --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv'
          if ($target -ne "false`tfalse") { throw 'Rollback target must be a published stable release.' }
          "current_tag=$currentTag" >> $env:GITHUB_OUTPUT

      - name: Download and verify signed rollback assets
        shell: pwsh
        env:
          CURRENT_TAG: ${{ steps.validate.outputs.current_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path rollback | Out-Null
          New-Item -ItemType Directory -Path current | Out-Null
          gh release download $env:TARGET_TAG --dir rollback --pattern '*.exe' --pattern '*.blockmap' --pattern 'latest.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download rollback release assets.' }
          gh release download $env:CURRENT_TAG --dir current --pattern '*-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the current signed installer.' }

          $installers = @(Get-ChildItem rollback -File -Filter '*-setup.exe')
          $currentInstallers = @(Get-ChildItem current -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one rollback installer, found $($installers.Count)." }
          if ($currentInstallers.Count -ne 1) { throw "Expected one current installer, found $($currentInstallers.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $currentSignature = Get-AuthenticodeSignature -LiteralPath $currentInstallers[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Rollback installer signature is not valid: $($signature.Status)" }
          if ($currentSignature.Status -ne 'Valid') { throw "Current installer signature is not valid: $($currentSignature.Status)" }
          if ($signature.SignerCertificate.Subject -cne $currentSignature.SignerCertificate.Subject) {
            throw 'Rollback installer publisher does not match the current signed application.'
          }

          if (-not (Test-Path 'rollback/latest.yml')) { throw 'Rollback source is missing latest.yml.' }
          $manifest = Get-Content -LiteralPath 'rollback/latest.yml' -Raw
          $expectedVersion = $env:TARGET_TAG.Substring(1)
          $manifestVersion = [regex]::Match($manifest, '(?m)^version:\s*["'']?([^\s"'']+)["'']?\s*$').Groups[1].Value
          $manifestPath = [regex]::Match($manifest, '(?m)^path:\s*["'']?(.+?)["'']?\s*$').Groups[1].Value
          $manifestSha512 = [regex]::Match($manifest, '(?m)^sha512:\s*([^\s]+)\s*$').Groups[1].Value
          if ($manifestVersion -cne $expectedVersion) { throw "Rollback manifest version $manifestVersion does not match $expectedVersion." }
          if ($manifestPath -cne $installers[0].Name) { throw 'Rollback manifest path does not match the signed installer.' }
          $actualSha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installers[0].FullName)))
          if ($manifestSha512 -cne $actualSha512) { throw 'Rollback manifest SHA-512 does not match the signed installer.' }

          Move-Item -LiteralPath 'rollback/latest.yml' -Destination 'rollback/rollback.yml'
          node scripts/generate-checksums.mjs rollback ROLLBACK-SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-rollback-${{ github.run_id }}
          path: rollback/*
          if-no-files-found: error
          retention-days: 1

  publish-rollback:
    needs: verify-rollback
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      CURRENT_TAG: ${{ needs.verify-rollback.outputs.current_tag }}
      TARGET_TAG: ${{ inputs.target_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-windows-rollback-${{ github.run_id }}
          path: rollback

      - name: Verify transferred rollback checksums
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath 'rollback/ROLLBACK-SHA256SUMS.txt')
          if ($lines.Count -lt 3) { throw 'Rollback checksum manifest is incomplete.' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Malformed checksum entry: $line" }
            $file = Join-Path 'rollback' $Matches[2]
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Checksummed rollback asset is missing: $file" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $Matches[1]) { throw "Checksum mismatch for $file" }
          }

      - name: Publish rollback channel on current release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestTag = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or $latestTag -cne $env:CURRENT_TAG) {
            throw 'The latest release changed after rollback verification; start a new rollback run.'
          }
          $assets = @(Get-ChildItem rollback -File)
          gh release upload $env:CURRENT_TAG @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified rollback channel.' }
          "Rollback channel now points from $env:CURRENT_TAG to signed $env:TARGET_TAG artifacts."
