name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:security
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:security
      - run: npm run build:win
      - name: Verify packaged output
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*-setup.exe'
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }
          if (-not (Test-Path 'dist/latest.yml')) { throw 'Missing auto-update metadata dist/latest.yml.' }
          if (-not (Test-Path 'dist/win-unpacked/interview-copilot.exe')) { throw 'Missing packaged application executable.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            build/generated/build-metadata.json
          if-no-files-found: error
          retention-days: 7
